<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sigil BA">
  <!-- Monogramme « BA » sous forme de sigil chromé.
       Le A forme un triangle (alchimie : feu / élévation),
       le B partage la hampe centrale du A, les nœuds évoquent une topologie réseau. -->
  <defs>
    <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#9b98ad"/>
      <stop offset=".5" stop-color="#f5f3ff"/>
      <stop offset=".72" stop-color="#6d6880"/>
      <stop offset="1" stop-color="#d9ccff"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#07060b"/>
  <g fill="none" stroke="url(#chrome)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="44" stroke-width="2.5"/>
    <path d="M27 77 L50 21 L73 77" stroke-width="5"/>
    <path d="M50 21 V77" stroke-width="5"/>
    <path d="M50 35 Q65 35 65 44.5 Q65 53 50 53 Q70 53 70 64.5 Q70 77 50 77" stroke-width="5"/>
    <path d="M36 61 H50" stroke-width="5"/>
  </g>
  <circle cx="50" cy="21" r="4.5" fill="#c6ff3d"/>
</svg>
